<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spam Email Classifier</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico?v=1">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png?v=1">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png?v=1">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <link rel="manifest" href="/static/site.webmanifest">
</head>
<script>
    const bar = document.querySelector(".progress-bar");
    if (bar) {
        const width = bar.getAttribute("data-width");
        bar.style.width = width + "%";
    }
</script>
<script>
    if (performance.navigation.type === 1) {
        window.location.href = "/";
    }
    window.addEventListener("pageshow", function (event) {
        if (event.persisted) {
            window.location.reload();
        }
    });
</script>
<body>

<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-lg-6">

            <div class="card shadow-lg custom-card">
                <div class="card-body">

                    <h3 class="text-center mb-4 fw-bold">
                        📧 Spam Email Classifier
                    </h3>

                    <form action="/predict" method="post">

                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Enter your email message:
                            </label>

                            <textarea class="form-control"
                                      name="message"
                                      rows="5"
                                      required>{{ message if message else "" }}</textarea>
                        </div>

                        <div class="d-grid">
                            <button type="submit"
                                    class="btn btn-primary btn-lg">
                                Analyze Message
                            </button>
                        </div>
                    </form>

                    {% if result %}
                    <div class="mt-4">

                        <div class="alert 
                            {% if result == 'Spam' %}
                                alert-danger
                            {% else %}
                                alert-success
                            {% endif %}
                            text-center fw-bold">

                            Prediction: {{ result }}
                        </div>

                        <div class="progress mt-3">
                                <div class="progress-bar 
                                    {% if result == 'Spam' %}
                                        bg-danger
                                    {% else %}
                                        bg-success
                                    {% endif %}"
                                    role="progressbar"
                                    style="width: {{ confidence }}%;">
                                    {{ confidence }}%
                                </div>
                        </div>

                    </div>
                    {% endif %}

                </div>
            </div>

        </div>
    </div>

</div>

</body>
</html>
